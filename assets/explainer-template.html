<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="explainer-profile" content="editorial-v1">
  <meta name="learning-design" content="discovery-first-v1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1a1a18;
      --muted: #6b6862;
      --paper: #faf9f6;
      --panel: #ffffff;
      --inset: #faf8f1;
      --line: #e3e0d8;
      --accent: #b3541e;
      --accent-soft: #f3e8e0;
      --content-width: 45.125rem;
      --radius: 0.75rem;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.65;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.16em;
    }

    a:hover { text-decoration-thickness: 0.14em; }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 3px;
    }

    .shell {
      width: min(calc(100% - 2rem), var(--content-width));
      margin-inline: auto;
    }

    header { padding: 3.5rem 0 1rem; }

    h1, h2, h3 { text-wrap: balance; }

    h1 {
      margin: 0 0 0.55rem;
      font-size: clamp(2rem, 5vw, 2.1rem);
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .lede {
      margin: 0.7rem 0;
      font-size: 1rem;
    }

    main { padding-bottom: 5rem; }

    section { padding: 0; }

    .step-title,
    .sources h2 {
      margin: 3rem 0 0.3rem;
      font-size: 1.3rem;
      line-height: 1.65;
      letter-spacing: -0.015em;
    }

    .step-number { color: var(--accent); }

    .goal {
      margin: 0.55rem 0 1.35rem;
      padding: 0.15rem 0 0.15rem 0.8rem;
      border-left: 3px solid var(--accent);
      color: var(--muted);
      font-style: italic;
    }

    .interactive {
      margin: 1.25rem 0;
      padding: 1.2rem 1.3rem;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .model {
      margin-bottom: 1rem;
      padding: 0.65rem 0.95rem;
      border-left: 3px solid var(--accent);
      border-radius: 0.5rem;
      background: var(--inset);
    }

    .model-label {
      margin: 0 0 0.25rem;
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: end;
      margin: 1rem 0;
    }

    label {
      display: grid;
      min-width: min(100%, 13rem);
      gap: 0.35rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 650;
    }

    input, select, button { font: inherit; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    button {
      min-height: 2.5rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid var(--ink);
      border-radius: 0.5rem;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
    }

    button:hover { filter: brightness(1.12); }

    button.secondary {
      border-color: var(--line);
      background: transparent;
      color: var(--muted);
    }

    .output {
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.88rem;
    }

    .takeaway { margin: 1rem 0 0; }

    details.optional-depth {
      margin: 1.25rem 0;
      padding-top: 0.8rem;
      border-top: 1px solid var(--line);
    }

    details.optional-depth summary {
      color: var(--muted);
      cursor: pointer;
      font-weight: 650;
    }

    .sources {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .sources li + li { margin-top: 0.6rem; }

    .skip-link {
      position: fixed;
      z-index: 10;
      top: 0.7rem;
      left: 0.7rem;
      padding: 0.5rem 0.75rem;
      transform: translateY(-160%);
      border-radius: 0.35rem;
      background: var(--ink);
      color: var(--paper);
    }

    .skip-link:focus { transform: translateY(0); }

    @media (max-width: 640px) {
      body { font-size: 16px; }
      .shell { width: min(calc(100% - 1.25rem), var(--content-width)); }
      header { padding-top: 2.75rem; }
      h1 { font-size: 1.9rem; }
      .interactive { padding: 1rem; }
      .controls > * { flex: 1 1 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="editorial-profile declaude-editorial">
  <a class="skip-link" href="#main">{{SKIP_LABEL}}</a>

  <header class="shell">
    <h1>{{TITLE}}</h1>
    <p class="lede">{{INTRODUCTION}}</p>
  </header>

  <main class="shell" id="main">
    <!-- For core steps, preserve the discovery order described by the skill:
         concrete need, learner anticipation, visible consequence, plain-language
         explanation, concept name, then a changed transfer case. -->
    {{SECTIONS}}

    <section class="sources" id="sources" aria-labelledby="sources-title">
      <h2 id="sources-title">{{SOURCES_TITLE}}</h2>
      <p>{{SOURCES_NOTE}}</p>
      <ol>
        {{SOURCE_ITEMS}}
      </ol>
    </section>
  </main>

  <noscript>
    <p class="shell">{{NOSCRIPT_MESSAGE}}</p>
  </noscript>

  <script>
    "use strict";

    // Keep interaction state local, derive outputs from the current controls,
    // and expose the important result as text in an aria-live region.
    {{SCRIPT}}
  </script>
</body>
</html>
